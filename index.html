<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TNS Group</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #111820;
            color: #ffffff;
        }

        .content {
            max-width: 850px;
            text-align: center;
        }

        h1 {
            margin: 0 0 20px;
            font-size: clamp(48px, 9vw, 96px);
            letter-spacing: 4px;
        }

        p {
            margin: 0;
            font-size: clamp(20px, 3vw, 30px);
            line-height: 1.5;
            color: #c9d1d9;
        }

        .domain {
            margin-top: 35px;
            font-size: 16px;
            color: #8b949e;
        }
    </style>
</head>

<body>
    <main class="content">
        <h1>TNS GROUP</h1>

        <p>
            Официальный сайт компании находится в разработке
        </p>

        <div class="domain">
            tns-grp.ru
        </div>
    </main>
</body>
</html>
